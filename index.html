<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#11151e"><title>Mi entrenamiento</title><style>body{font:16px system-ui;background:#11151e;color:#eee;max-width:560px;margin:auto;padding:18px}h1{font-size:26px}section{background:#202634;border-radius:16px;padding:15px;margin:12px 0}button,input,select{font:inherit;border:0;border-radius:9px;padding:10px;background:#343d50;color:white}button{cursor:pointer}button.active,button.primary{background:#a99be8;color:#171323}nav{display:flex;gap:8px;flex-wrap:wrap}small{color:#b9c1d0}input[type=number]{width:70px}label{display:block;margin:8px 0} .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .line b{flex:1}progress{width:100%;accent-color:#a99be8}button:disabled{opacity:.4}.demo{margin:10px 0}.demo summary{cursor:pointer;color:#c9bbff;padding:9px 0}.demo svg{display:block;width:100%;max-height:220px;margin:5px 0}.demo small{display:block;font-size:12px}</style><h1>Mi entrenamiento</h1><small>FUERZA · RESISTENCIA · 3 DÍAS</small><nav id="nav"></nav><main id="main"></main><script>
const plans={A:['Extensión de cuádriceps','Press de pecho en máquina','Jalón al pecho','Curl femoral sentado','Elevaciones laterales sentado','Dead bug'],B:['Abductores en máquina','Remo sentado con apoyo de pecho','Press inclinado en máquina','Extensión de cuádriceps','Press de hombros sentado','Crunch abdominal'],C:['Curl femoral sentado','Aperturas de pecho en máquina','Jalón al pecho agarre neutro','Abductores en máquina','Curl de bíceps sentado','Extensión de tríceps sentado']};const tips={'Extensión de cuádriceps':'Alineá la rodilla con el eje de la máquina. Extendé sin bloquear.','Press de pecho en máquina':'Espalda apoyada, empujá sin bloquear los codos.','Jalón al pecho':'Llevá la barra hacia el pecho, sin balancearte.','Curl femoral sentado':'Flexioná las rodillas lentamente, sin empujar con los dedos.','Elevaciones laterales sentado':'Elevá los brazos hasta la altura de los hombros.','Dead bug':'Boca arriba, alterná brazo y pierna contrarios sin arquear la espalda.','Abductores en máquina':'Separá las rodillas lentamente, sin impulsarte con los pies.','Remo sentado con apoyo de pecho':'Tirá de los agarres hacia el torso, sin empujar con los pies.','Press inclinado en máquina':'Empujá hacia arriba y adelante con espalda apoyada.','Press de hombros sentado':'Empujá hacia arriba sin arquear la espalda.','Crunch abdominal':'Elevá ligeramente los hombros sin tirar del cuello.','Aperturas de pecho en máquina':'Acercá los brazos con codos ligeramente flexionados.','Jalón al pecho agarre neutro':'Palmas enfrentadas, llevá los agarres hacia el pecho.','Curl de bíceps sentado':'Flexioná los codos sin mover el torso.','Extensión de tríceps sentado':'Extendé los codos con carga ligera y espalda estable.'};const visuals={
'Extensión de cuádriceps':['leg','extend'], 'Curl femoral sentado':['leg','curl'], 'Abductores en máquina':['front','abduct'], 'Press de pecho en máquina':['side','press'], 'Press inclinado en máquina':['side','incline'], 'Remo sentado con apoyo de pecho':['side','row'], 'Jalón al pecho':['side','pull'], 'Jalón al pecho agarre neutro':['side','pull'], 'Press de hombros sentado':['side','shoulder'], 'Elevaciones laterales sentado':['front','raise'], 'Aperturas de pecho en máquina':['front','fly'], 'Curl de bíceps sentado':['side','biceps'], 'Extensión de tríceps sentado':['side','triceps'], 'Crunch abdominal':['floor','crunch'], 'Dead bug':['floor','dead']};
function demo(e){let [view,m]=visuals[e];let machine=!['raise','biceps','triceps','crunch','dead'].includes(m);let base='',body='',moving='';const line=(d,c='#e8e9f2',w=9)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;const motion=(a,b,c='#b7a6ff',w=10)=>`<path d="${a}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="d" values="${a};${b};${a}" dur="3s" repeatCount="indefinite"/></path>`;const head=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#e8e9f2"/>`;
if(view==='floor'){base=line('M45 150 H275','#657188',5);body=head(75,132)+line('M90 139 L155 139 L190 103 L230 146');moving=m==='crunch'?motion('M90 139 L120 139 L155 139','M90 105 L120 123 L155 139'):motion('M110 137 L110 80 L110 60 M155 139 L190 103 L230 146','M110 137 L70 100 L48 95 M155 139 L200 125 L245 120');if(m==='crunch'){body=line('M155 139 L190 103 L230 146')+`<circle cx="75" cy="132" r="13" fill="#e8e9f2"><animate attributeName="cy" values="132;98;132" dur="3s" repeatCount="indefinite"/></circle>`}}
else if(view==='front'){base=line('M95 170 H225 M160 170 V120 M115 118 H205','#657188',7);body=head(160,43)+line('M160 60 V112 M160 75 L130 75 M160 75 L190 75');if(m==='abduct'){base+=line('M90 145 V95 M230 145 V95','#657188',8);moving=motion('M145 112 L135 137 L135 165 M175 112 L185 137 L185 165','M145 112 L100 137 L100 165 M175 112 L220 137 L220 165');body+=line('M130 75 L130 110 M190 75 L190 110')}else{body+=line('M145 112 L135 145 L135 165 M175 112 L185 145 L185 165');moving=m==='raise'?motion('M130 75 L120 108 L120 130 M190 75 L200 108 L200 130','M130 75 L95 75 L65 75 M190 75 L225 75 L255 75'):motion('M130 75 L95 75 L65 75 M190 75 L225 75 L255 75','M130 75 L145 85 L155 85 M190 75 L175 85 L165 85');if(m==='fly')base+=line('M60 170 V65 H95 M260 170 V65 H225','#657188',6)}}
else{base=line('M85 170 H250 M130 170 V115 H185 M128 115 L115 65','#657188',7);if(machine)base+=line('M245 170 V25 H145','#657188',6)+`<rect x="230" y="100" width="30" height="65" rx="4" fill="#465269"/>`;body=head(135,42)+line('M135 59 L145 110 L185 110');if(view==='leg'){body+=line('M140 72 L165 95 L180 95');moving=m==='extend'?motion('M185 110 L185 145 L185 158','M185 110 L225 110 L240 110'):motion('M185 110 L225 110 L240 110','M185 110 L185 145 L170 155');base+=line('M185 110 L205 150','#657188',5)+`<rect x="194" y="142" width="22" height="12" rx="5" fill="#657188"/>`}else{body+=line('M185 110 L185 150 L205 150');let pairs={press:['M140 70 L160 95 L180 75','M140 70 L185 75 L225 75'],incline:['M140 70 L165 95 L180 70','M140 70 L175 48 L205 25'],row:['M140 70 L185 85 L225 85','M140 70 L115 95 L165 85'],pull:['M140 70 L150 35 L165 15','M140 70 L125 95 L165 65'],shoulder:['M140 70 L165 90 L175 60','M140 70 L150 35 L155 12'],biceps:['M140 70 L150 110 L160 140','M140 70 L150 110 L175 75'],triceps:['M140 70 L145 35 L115 65','M140 70 L145 35 L145 8']};moving=motion(...pairs[m]);if(m==='row')base+=line('M170 115 V65','#657188',12);if(m==='pull')base+=line('M140 15 H190','#657188',5)}}
return `<details class="demo"><summary>Ver máquina y movimiento</summary><svg viewBox="0 0 320 185" role="img" aria-label="Esquema animado de ${e}"><rect width="320" height="185" rx="12" fill="#161c29"/>${base}${body}${moving}</svg><small>Esquema orientativo animado · violeta: movimiento. La máquina real puede variar. Pedí al profesor que ajuste el equipo.</small></details>`}
let db={logs:[],weights:[],drafts:{}};try{db=JSON.parse(localStorage.getItem('gym-v1'))||db}catch(e){};let day=({1:'A',3:'B',5:'C'})[new Date().getDay()]||'B',tab='Rutina',timer=null,left=60;const date=()=>new Date().toLocaleDateString('en-CA');const save=()=>{try{localStorage.setItem('gym-v1',JSON.stringify(db))}catch(e){alert('No se pudo guardar. Exportá tus datos.')}};function draft(){return db.drafts[date()+day]??={sets:{},kg:{},before:'',after:'',warm:false,cardio:false}}function update(k,v){draft()[k]=v;save()}function render(){nav.innerHTML=['Rutina','Historial','Progreso'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');if(tab==='Historial'){main.innerHTML='<h2>Historial</h2>'+ (db.logs.slice().reverse().map(l=>`<section><b>${l.date} · Rutina ${l.day}</b><p>${Object.values(l.sets).filter(Boolean).length}/12 series · Pie antes: ${l.before||'—'} / después: ${l.after||'—'}</p>${plans[l.day].map((e,i)=>`<div>${e}: ${Number(l.kg[i])||'—'} kg</div>`).join('')}</section>`).join('')||'<p>Todavía no hay sesiones.</p>')+'<button onclick="exportData()">Exportar respaldo</button>';return}if(tab==='Progreso'){main.innerHTML=`<section><h2>Peso corporal</h2><input id="weight" type="number" min="1" step="0.1" placeholder="kg"><button onclick="addWeight()">Guardar</button>${db.weights.slice().reverse().map(w=>`<p>${w.date}: ${w.kg} kg</p>`).join('')}</section>`;return}let d=draft();main.innerHTML=`<section><nav>${['A','B','C'].map((x,i)=>`<button class="${day===x?'active':''}" onclick="day='${x}';render()">${['Lun','Mié','Vie'][i]} · ${x}</button>`).join('')}</nav><p>35–40 min · 2 series por ejercicio · carga ligera</p><progress max="12" value="${Object.values(d.sets).filter(Boolean).length}"></progress><p><small>Con edema óseo, consultá al traumatólogo antes de entrenar piernas. Sin autorización, omití piernas y bicicleta. Suspendé si aparece dolor. No correr ni saltar.</small></p><label>Dolor del pie antes (0–10) <select onchange="update('before',this.value)">${opts(d.before)}</select></label><label><input type="checkbox" ${d.warm?'checked':''} onchange="update('warm',this.checked)"> Entrada en calor: 5 min de ergómetro de brazos o movilidad sentada</label></section><section><b>Descanso: <span id="clock">${left}</span> s</b> <button onclick="startTimer()">60 s</button> <button onclick="clearInterval(timer);left=60;document.getElementById('clock').textContent=left">Reiniciar</button></section>`+plans[day].map((e,i)=>`<section><b>${i+1}. ${e}</b><p><small>${tips[e]}</small></p>${demo(e)}<div class="line"><span>${e==='Dead bug'?'8 por lado':'12 rep.'}</span>${[0,1].map(j=>`<label><input type="checkbox" ${d.sets[i+'-'+j]?'checked':''} onchange="draft().sets['${i}-${j}']=this.checked;save();render()"> S${j+1}</label>`).join('')}<input type="number" min="0" step="0.5" placeholder="kg" value="${Number(d.kg[i])||''}" onchange="draft().kg[${i}]=this.value;save()"></div></section>`).join('')+`<section><label><input type="checkbox" ${d.cardio?'checked':''} onchange="update('cardio',this.checked)"> Cardio final: 5–8 min de brazos o bicicleta solo autorizada y sin dolor</label><label>Dolor después (0–10) <select onchange="update('after',this.value)">${opts(d.after)}</select></label><button class="primary" onclick="finish()">Guardar entrenamiento</button></section>`}function opts(v){return '<option value="">Elegir</option>'+Array.from({length:11},(_,i)=>`<option ${String(i)===v?'selected':''}>${i}</option>`).join('')}function startTimer(){clearInterval(timer);left=60;document.getElementById('clock').textContent=left;timer=setInterval(()=>{left--;let el=document.getElementById('clock');if(el)el.textContent=left;if(left<=0){clearInterval(timer);if(navigator.vibrate)navigator.vibrate(200)}},1000)}function finish(){let d=draft();db.logs.push(JSON.parse(JSON.stringify({...d,date:date(),day})));delete db.drafts[date()+day];save();tab='Historial';render()}function addWeight(){let w=Number(document.getElementById('weight').value);if(w>0){db.weights.push({date:date(),kg:w});save();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='entrenamiento-respaldo.json';a.click()}render();</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);</script></html>
