<style>
:root{--bg:#11151e;--card:#202634;--ctl:#343d50;--acc:#a99be8;--acc-ink:#171323;--text:#eee;--muted:#b9c1d0;--warn:#f2c46d;--bad:#ef8a8a}
*{box-sizing:border-box}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);max-width:560px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0 0 2px}
h2{font-size:20px;margin:4px 0 10px}
section{background:var(--card);border-radius:16px;padding:15px;margin:12px 0}
button,input,select{font:inherit;border:0;border-radius:9px;padding:10px;background:var(--ctl);color:#fff}
button{cursor:pointer}
button.active,button.primary{background:var(--acc);color:var(--acc-ink)}
button.ghost{background:transparent;color:var(--muted);padding:6px 8px}

:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:8px;flex-wrap:wrap}

.chips{flex-wrap:nowrap;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;padding:8px 12px}
.tools{margin:8px 0}
.tools button{min-width:44px}
input[type=search]{width:100%;margin-top:4px}
.libgroup > h2{margin:22px 0 4px}
[hidden]{display:none!important}
small,.muted{color:var(--muted)}
label{display:block;margin:8px 0}
input[type=checkbox]{width:22px;height:22px;margin:0 6px 0 0;padding:0;accent-color:var(--acc);vertical-align:middle}
.kg{width:84px}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set{display:inline-flex;align-items:center;margin:0;padding:8px 10px;background:var(--ctl);border-radius:9px;cursor:pointer}
.last{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px}
progress{flex:1;width:100%;accent-color:var(--acc)}
.warn{background:#3a3220;color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--bad);font-weight:600}
.demo{margin:10px 0}.demo summary{cursor:pointer;color:#c9bbff;padding:9px 0}.demo svg{display:block;width:100%;max-height:220px;margin:5px 0}.demo small{display:block;font-size:12px}
.chart svg{display:block;width:100%;height:auto;margin:8px 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.timerbar{position:fixed;left:0;right:0;bottom:0;background:#1a2030;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #2c3446;transition:background .3s}
.timerbar .in{max-width:524px;margin:auto;display:flex;align-items:center;gap:10px}
.timerbar b{flex:1;font-size:22px;font-variant-numeric:tabular-nums}
.timerbar.done{background:#5a4b9c}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.timerbar,.toast{transition:none}}
</style>

<script>
// ---------- Biblioteca de ejercicios ----------
// Solo ejercicios sin impacto, sentado, acostado o con apoyo, que no cargan peso sobre el pie.

const LIBRARY = [

const GROUPS = ['Pecho', 'Espalda', 'Hombros', 'Bíceps', 'Tríceps', 'Piernas', 'Glúteos', 'Abdomen'];
const LIB = Object.fromEntries(LIBRARY.map(x => [x.n, x]));
const tips = Object.fromEntries(LIBRARY.map(x => [x.n, x.t]));
const visuals = Object.fromEntries(LIBRARY.filter(x => x.v).map(x => [x.n, x.v]));
const PLANS_V1={A:['Extensión de cuádriceps','Press de pecho en máquina','Jalón al pecho','Curl femoral sentado','Elevaciones laterales sentado','Dead bug'],B:['Abductores en máquina','Remo sentado con apoyo de pecho','Press inclinado en máquina','Extensión de cuádriceps','Press de hombros sentado','Crunch abdominal'],C:['Curl femoral sentado','Aperturas de pecho en máquina','Jalón al pecho agarre neutro','Abductores en máquina','Curl de bíceps sentado','Extensión de tríceps sentado']};const DEFAULT_ROUTINES={A:['Extensión de cuádriceps','Press de pecho en máquina','Jalón al pecho','Curl femoral sentado','Almeja con banda','Elevaciones laterales sentado','Dead bug'],B:['Abductores en máquina','Aductores en máquina','Remo sentado con apoyo de pecho','Press inclinado en máquina','Extensión de cuádriceps','Press de hombros sentado','Crunch abdominal'],C:['Curl femoral sentado','Aperturas de pecho en máquina','Jalón al pecho agarre neutro','Abductores en máquina','Elevación de pierna recta','Curl de bíceps sentado','Extensión de tríceps sentado']};
function demo(e,open){if(!visuals[e])return '';let [view,m]=visuals[e];let machine=!['raise','biceps','triceps','crunch','dead','frontraise'].includes(m);let base='',body='',moving='';const line=(d,c='#e8e9f2',w=9)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;const motion=(a,b,c='#b7a6ff',w=10)=>`<path d="${a}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="d" values="${a};${b};${a}" dur="3s" repeatCount="indefinite"/></path>`;const head=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#e8e9f2"/>`;
if(view==='floor'){base=line('M45 150 H275','#657188',5);body=head(75,132)+line('M90 139 L155 139 L190 103 L230 146');moving=m==='crunch'?motion('M90 139 L120 139 L155 139','M90 105 L120 123 L155 139'):motion('M110 137 L110 80 L110 60 M155 139 L190 103 L230 146','M110 137 L70 100 L48 95 M155 139 L200 125 L245 120');if(m==='slr'){moving=motion('M155 139 L200 139 L245 139','M155 139 L195 117 L235 95')}if(m==='clam'){body=head(75,132)+line('M90 139 L155 139')+line('M155 141 L195 137 L220 148','#9aa3b5');moving=motion('M155 137 L195 133 L220 146','M155 137 L188 98 L220 146')}if(m==='crunch'){body=line('M155 139 L190 103 L230 146')+`<circle cx="75" cy="132" r="13" fill="#e8e9f2"><animate attributeName="cy" values="132;98;132" dur="3s" repeatCount="indefinite"/></circle>`}}
else if(view==='front'){base=line('M95 170 H225 M160 170 V120 M115 118 H205','#657188',7);body=head(160,43)+line('M160 60 V112 M160 75 L130 75 M160 75 L190 75');if(m==='abduct'||m==='adduct'){base+=line('M90 145 V95 M230 145 V95','#657188',8);let ab=['M145 112 L135 137 L135 165 M175 112 L185 137 L185 165','M145 112 L100 137 L100 165 M175 112 L220 137 L220 165'];moving=m==='adduct'?motion(ab[1],ab[0]):motion(...ab);body+=line('M130 75 L130 110 M190 75 L190 110')}else{body+=line('M145 112 L135 145 L135 165 M175 112 L185 145 L185 165');let fl=['M130 75 L95 75 L65 75 M190 75 L225 75 L255 75','M130 75 L145 85 L155 85 M190 75 L175 85 L165 85'];moving=m==='raise'?motion('M130 75 L120 108 L120 130 M190 75 L200 108 L200 130','M130 75 L95 75 L65 75 M190 75 L225 75 L255 75'):m==='rfly'?motion(fl[1],fl[0]):motion(...fl);if(m==='fly'||m==='rfly')base+=line('M60 170 V65 H95 M260 170 V65 H225','#657188',6)}}
else{base=line('M85 170 H250 M130 170 V115 H185 M128 115 L115 65','#657188',7);if(machine)base+=line('M245 170 V25 H145','#657188',6)+`<rect x="230" y="100" width="30" height="65" rx="4" fill="#465269"/>`;body=head(135,42)+line('M135 59 L145 110 L185 110');if(view==='leg'){body+=line('M140 72 L165 95 L180 95');moving=m==='extend'?motion('M185 110 L185 145 L185 158','M185 110 L225 110 L240 110'):motion('M185 110 L225 110 L240 110','M185 110 L185 145 L170 155');base+=line('M185 110 L205 150','#657188',5)+`<rect x="194" y="142" width="22" height="12" rx="5" fill="#657188"/>`}else{body+=line('M185 110 L185 150 L205 150');let pairs={press:['M140 70 L160 95 L180 75','M140 70 L185 75 L225 75'],incline:['M140 70 L165 95 L180 70','M140 70 L175 48 L205 25'],row:['M140 70 L185 85 L225 85','M140 70 L115 95 L165 85'],pull:['M140 70 L150 35 L165 15','M140 70 L125 95 L165 65'],shoulder:['M140 70 L165 90 L175 60','M140 70 L150 35 L155 12'],biceps:['M140 70 L150 110 L160 140','M140 70 L150 110 L175 75'],triceps:['M140 70 L145 35 L115 65','M140 70 L145 35 L145 8'],frontraise:['M140 70 L148 105 L152 135','M140 70 L180 68 L215 62'],dip:['M140 70 L162 92 L172 72','M140 70 L150 105 L152 128']};moving=motion(...pairs[m]);if(m==='row')base+=line('M170 115 V65','#657188',12);if(m==='pull')base+=line('M140 15 H190','#657188',5)}}
const G=line('M45 150 H275','#657188',5),quad=head(80,92)+line('M93 102 L168 104')+line('M100 106 L100 148')+line('M168 104 L172 146 L205 147');const ex={bench:()=>[G+line('M60 132 H205','#657188',8)+line('M75 136 V150 M190 136 V150','#657188',6),head(80,114)+line('M95 122 L170 122 L195 98 L215 122'),motion('M125 120 L110 100 L125 88','M125 120 L125 85 L125 55')],prone:()=>[G+line('M60 134 H215','#657188',8)+line('M75 138 V150 M200 138 V150','#657188',6),head(72,116)+line('M87 124 L205 124')+line('M100 126 L112 140'),motion('M205 124 L245 124 L258 122','M205 124 L210 88 L214 76')],sidelift:()=>[G,head(75,132)+line('M90 139 L155 139')+line('M155 142 L240 142','#9aa3b5'),motion('M155 137 L240 137','M155 137 L235 103')],kneeup:()=>[G,head(75,132)+line('M90 139 L155 139'),motion('M155 139 L195 118 L235 137','M155 139 L140 100 L182 92')],kick:()=>[G,quad,motion('M168 103 L172 145 L205 146','M168 103 L212 98 L214 62')],birddog:()=>[G,quad,motion('M110 106 L110 148 M160 104 L165 146 L198 147','M110 106 L72 113 L42 116 M160 104 L210 102 L255 100')],plank:()=>[G,head(70,104)+line('M84 112 L165 143 L232 145')+line('M96 116 L96 146 L130 146'),'']};const X=ex[m]&&ex[m]();if(X)[base,body,moving]=X;

// ---------- Utilidades ----------
const STORE = 'gym-v1';
const LEGS = new Set(LIBRARY.filter(x => x.g === 'Piernas' || x.g === 'Glúteos').map(x => x.n));
const NO_KG = new Set(LIBRARY.filter(x => x.kg === false).map(x => x.n));
const REPS = Object.fromEntries(LIBRARY.filter(x => x.r).map(x => [x.n, x.r]));
const DAYS = ['A', 'B', 'C'];
const copyRoutines = r => Object.fromEntries(DAYS.map(d => [d, r[d].slice()]));
// Tiempo estimado: 10 min de entrada en calor y cardio, más unos 4,5 min por ejercicio (2 series con descanso)
const minutes = n => n ? Math.round((10 + n * 4.5) / 5) * 5 : 0;
const DAY_LABEL = { A: 'Lun', B: 'Mié', C: 'Vie' };
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toLocaleDateString('en-CA');
const fmt = s => s.split('-').reverse().join('/');
const fmtShort = s => fmt(s).slice(0, 5);
const num = v => { const n = Number(String(v).trim().replace(',', '.')); return Number.isFinite(n) && n > 0 ? n : null; };
const kgText = n => String(Math.round(n * 10) / 10).replace('.', ',');

// ---------- Datos: carga y migración desde la versión 1 ----------
function blank() {
  return { v: 4, logs: [], weights: [], routines: copyRoutines(DEFAULT_ROUTINES), settings: { legs: true, painAlert: '', lastBackup: null } };
}
function isOld(e) {
  return Object.keys(e.sets || {}).some(k => /^\d+-\d$/.test(k)) || Object.keys(e.kg || {}).some(k => /^\d+$/.test(k));
}
// La v1 guardaba series y kilos por posición (0, 1, 2…). Ahora se guardan por nombre de ejercicio.
function upgrade(e, day) {
  const base = { sets: {}, kg: {}, before: '', after: '', warm: false, cardio: false, ...e };
  if (!isOld(e)) return base;
  const sets = {}, kg = {};
  (PLANS_V1[day] || []).forEach((ex, i) => {
    sets[ex] = [!!e.sets?.[i + '-0'], !!e.sets?.[i + '-1']];
    kg[ex] = num(e.kg?.[i]);
  });
  return { ...base, sets, kg };
}
function normalize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.logs)) throw new Error('Formato no válido');
  const out = blank();
  out.logs = d.logs
    .filter(l => l && DAYS.includes(l.day) && /^\d{4}-\d\d-\d\d$/.test(l.date))
    .map(l => { const u = upgrade(l, l.day); return { ...u, id: l.id || uid(), total: l.total || Object.keys(u.sets).length * 2 || PLANS_V1[l.day].length * 2 }; });
  out.weights = (Array.isArray(d.weights) ? d.weights : [])
    .map(w => ({ id: w.id || uid(), date: w.date, kg: num(w.kg) }))
    .filter(w => w.kg && w.date);
  Object.assign(out.settings, d.settings || {});
  if (d.routines) for (const day of DAYS) {

  // Las versiones anteriores dejaban la rutina del día como borrador hasta tocar "Guardar".
  // Ahora todo es sesión guardada: los borradores con datos pasan al historial.
  for (const [k, v] of Object.entries(d.drafts || {})) {

    if (!DAYS.includes(day) || !v || !/^\d{4}-\d\d-\d\d$/.test(date)) continue;
    const u = upgrade(v, day);
    const hasData = Object.values(u.sets).some(s => s.some(Boolean)) || Object.values(u.kg).some(Boolean) || u.before !== '' || u.after !== '' || u.warm || u.cardio;
    if (hasData && !out.logs.some(l => l.date === date && l.day === day)) {
      const l = { ...u, id: uid(), date, day, legs: out.settings.legs };
      syncSession(l, out.settings.legs, out.routines[day]);

function syncSession(l, legs = db.settings.legs, routine = db.routines[l.day]) {
  const list = routine.filter(e => legs || !LEGS.has(e));
  for (const e of Object.keys(l.sets)) {
    const empty = !(l.sets[e] || []).some(Boolean) && !l.kg[e];
    if (!list.includes(e) && empty) { delete l.sets[e]; delete l.kg[e]; }
  }
  list.forEach(e => { l.sets[e] ||= [false, false]; if (!(e in l.kg)) l.kg[e] = null; });
  l.legs = legs; l.total = Object.keys(l.sets).length * 2;

// Gráfico de líneas simple en SVG
function chart(series, labels, range) {
  const all = series.flatMap(s => s.vals).filter(v => v != null);
  if (all.length < 2) return '<p class="muted">Con dos registros o más vas a ver acá la evolución.</p>';
  const W = 320, H = 160, L = 36, R = 12, T = 10, B = 24;
  let lo = range ? range[0] : Math.min(...all), hi = range ? range[1] : Math.max(...all);
  if (!range) { const pad = hi === lo ? 1 : (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad; }
  const n = labels.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#343d50"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#b9c1d0" font-size="11">${kgText(v)}</text>`).join('');
  const lines = series.map(s => {
    const pts = s.vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    return `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`).join('');
  }).join('');
  const xl = `<text x="${x(0)}" y="${H - 6}" fill="#b9c1d0" font-size="11" text-anchor="start">${fmtShort(labels[0])}</text>` +
    (n > 1 ? `<text x="${x(n - 1)}" y="${H - 6}" fill="#b9c1d0" font-size="11" text-anchor="end">${fmtShort(labels[n - 1])}</text>` : '');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${series.map(s => s.name).join(' y ')}">${grid}${lines}${xl}</svg>${legend}</div>`;
}

async function exportData() {
  const name = `entrenamiento-respaldo-${today()}.json`;
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Respaldo de Mi entrenamiento' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    db.settings.lastBackup = today(); save(); render(); toast('Respaldo exportado');
  } catch (e) {
    if (e.name !== 'AbortError') alert('No se pudo exportar el respaldo.');
  }
}

  try { d = normalize(JSON.parse(await f.text())); }
  catch (e) { alert('Ese archivo no es un respaldo de esta app. Elegí el archivo entrenamiento-respaldo….json que exportaste.'); return; }
  if (!confirm(`El respaldo tiene ${d.logs.length} sesiones y ${d.weights.length} registros de peso. Va a reemplazar lo que tenés ahora (${db.logs.length} sesiones). ¿Continuar?`)) return;
  db = d; save(); tab = 'Historial'; render(); toast('Respaldo importado');
}

// ---------- Temporizador de descanso ----------
let tEnd = null, tInt = null, actx = null;
const paint = s => { $('clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function startTimer(sec = 60) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch (e) {}
  tEnd = Date.now() + sec * 1000; // se calcula con la hora de fin, así no se atrasa con la pantalla bloqueada
  $('timerbar').classList.remove('done');
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function stopTimer() { clearInterval(tInt); tEnd = null; paint(60); $('timerbar').classList.remove('done'); }
function tick() {
  if (!tEnd) return;
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  paint(left);
  if (left === 0) { clearInterval(tInt); tEnd = null; timerDone(); }
}
function timerDone() {
  $('timerbar').classList.add('done');
  navigator.vibrate?.([200, 100, 200]);
  if (actx) {
    const t = actx.currentTime;
    [0, 0.25, 0.5].forEach(dl => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + dl);
      g.gain.exponentialRampToValueAtTime(0.3, t + dl + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dl + 0.18);
      o.connect(g).connect(actx.destination); o.start(t + dl); o.stop(t + dl + 0.2);
    });
  }
  setTimeout(() => $('timerbar').classList.remove('done'), 4000);
  if (tab !== 'Rutina') render();
}
document.addEventListener('visibilitychange', tick);

// ---------- Eventos ----------
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  switch (b.dataset.act) {
    case 'tab': tab = b.dataset.tab; editing = false; render(); scrollTo(0, 0); break;
    case 'edit': editing = !editing; render(); break;
    case 'goLib': tab = 'Ejercicios'; editing = false; render(); scrollTo(0, 0); break;
    case 'group': libGroup = b.dataset.group; document.querySelectorAll('[data-act=group]').forEach(x => { const on = x.dataset.group === libGroup; x.classList.toggle('active', on); x.setAttribute('aria-pressed', on); }); applyLibFilter(); break;
    case 'toggleEx': {
      toggleEx(b.dataset.ex, b.dataset.day);
      const on = db.routines[b.dataset.day].includes(b.dataset.ex);
      b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
      b.setAttribute('aria-label', `${on ? 'Quitar de' : 'Agregar a'} la rutina ${b.dataset.day}`);
      b.textContent = (on ? '✓ ' : '+ ') + b.dataset.day;
      break;
    }
    case 'move': moveEx(b.dataset.ex, +b.dataset.dir); break;
    case 'remove': toggleEx(b.dataset.ex, day); render(); break;
    case 'resetRoutine':
      if (confirm(`¿Volver la rutina ${day} a los ejercicios originales?`)) { db.routines[day] = DEFAULT_ROUTINES[day].slice(); routineChanged(day); render(); toast('Rutina restaurada'); }
      break;
    case 'day': day = b.dataset.day; render(); break;
    case 'finish': finish(); break;
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'delLog': delLog(b.dataset.id); break;
    case 'addWeight': addWeight(); break;
    case 'delWeight': delWeight(b.dataset.id); break;
    case 'tStart': startTimer(); break;
    case 'tStop': stopTimer(); break;
  }
});
$('main').addEventListener('change', ev => {
  const t = ev.target, a = t.dataset.act, f = t.dataset.field;
  if (a === 'set') {
    const l = session(), s = l.sets[t.dataset.ex] ||= [false, false];
    s[+t.dataset.j] = t.checked; commit(l); updateProgress();
    if (t.checked) startTimer(); // el descanso arranca solo al marcar una serie
  } else if (a === 'kg') {
    const e = t.dataset.ex, v = t.value.trim(), cur = view().kg[e];
    if (v === '') return;
    const n = num(v);
    if (n === null || n > 500) { t.value = cur ? kgText(cur) : ''; toast('Ingresá los kilos como número, por ejemplo 12,5'); return; }
    t.value = kgText(n);
  } else if (a === 'legs') {
    db.settings.legs = t.checked;
    const l = findSession(); if (l) syncSession(l);
    save(); render();
  } else if (a === 'exSel') {
    selEx = t.value; render();
  } else if (a === 'painAlert') {
    db.settings.painAlert = t.value; save(); toast(t.value ? `Aviso con dolor ${t.value} o más` : 'Aviso desactivado');
  } else if (f) {
    const l = session(); l[f] = t.type === 'checkbox' ? t.checked : t.value; commit(l);
    if (f === 'before' || f === 'after') updatePain();
  }
});
$('main').addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'libSearch') { libQuery = t.value; applyLibFilter(); return; }
  if (t.dataset.act !== 'kg') return;
  const v = t.value.trim(), n = num(v);
  if (v === '') { const l = findSession(); if (l && l.kg[t.dataset.ex]) { l.kg[t.dataset.ex] = null; save(); } return; }
  if (n !== null && n <= 500) { const l = session(); l.kg[t.dataset.ex] = n; commit(l); }
});
$('main').addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'weight') addWeight(); });
// Recordar qué animaciones están abiertas para que no se cierren al marcar series
$('main').addEventListener('toggle', ev => {
  const d = ev.target;
  if (d.classList?.contains('demo')) d.open ? openDemos.add(d.dataset.ex) : openDemos.delete(d.dataset.ex);
}, true);
$('importFile').addEventListener('change', async ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) await importFile(f); });

render();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.error);</script>
</body>
